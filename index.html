<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Aura Studio — Team</title>
  <meta name="description" content="Aura Studio link tree — handcrafted photoreal frosted-glass profile cards.">
  <meta name="theme-color" content="#014BC8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Aura Studio — Team">
  <meta property="og:description" content="Handcrafted Apple-grade frosted glass link tree.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script
    type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Aura Studio","description":"Digital product design and engineering studio."}</script>

  <style>
    /* ── DESIGN TOKENS ── */
    :root {
      --wp-stop-0: #D9CEB1;
      --wp-stop-1: #C8D3CE;
      --wp-stop-2: #8BB7B6;
      --wp-stop-3: #3E8FE2;
      --wp-stop-4: #014BC8;
      --wp-blob-1: rgba(255, 255, 255, 0.20);
      --wp-blob-2: rgba(126, 200, 255, 0.33);
      --wp-blob-3: rgba(10, 46, 140, 0.40);
      --wp-streak: rgba(255, 255, 255, 0.22);
      --color-accent: #0A84FF;
      --color-accent-glow: rgba(10, 132, 255, 0.35);
      --color-focus-ring: #0A84FF;
      --font-family-system: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-size-name: clamp(22px, 5.5vw, 28px);
      --font-weight-name: 700;
      --letter-spacing-name: -0.022em;
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.82);
      --text-muted: rgba(255, 255, 255, 0.55);
      --text-shadow-name: 0 2px 18px rgba(0, 20, 60, 0.28);
      --card-width: min(90vw, 390px);
      --card-radius: 40px;
      --card-padding: 26px 22px 22px;
      --card-gap: clamp(10px, 1.8vh, 18px);
      --glass-card-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.30) 0%, rgba(255, 255, 255, 0.10) 22%, rgba(255, 255, 255, 0.06) 55%, rgba(255, 255, 255, 0.12) 100%);
      --glass-card-blur: 32px;
      --glass-card-saturate: 180%;
      --glass-card-border: rgba(255, 255, 255, 0.35);
      --glass-card-highlight-top: inset 0 1px 0 rgba(255, 255, 255, 0.55);
      --glass-card-highlight-bottom: inset 0 -1px 0 rgba(255, 255, 255, 0.18);
      --glass-card-shadow-outer: 0 30px 80px -20px rgba(2, 20, 60, 0.55);
      --glass-card-specular-corner: rgba(255, 255, 255, 0.22);
      --glass-fallback-solid: rgba(18, 32, 58, 0.86);
      --avatar-size: 100px;
      --avatar-border-color: rgba(255, 255, 255, 0.90);
      --avatar-ring-outer: rgba(255, 255, 255, 0.12);
      --avatar-ring-inner: rgba(255, 255, 255, 0.40);
      --avatar-shadow: 0 0 0 6px var(--avatar-ring-outer), 0 12px 32px rgba(0, 20, 60, 0.35), inset 0 0 0 1px var(--avatar-ring-inner);
      --avatar-glow-blur: 18px;
      --avatar-glow-opacity: 0.35;
      --avatar-glow-duration: 6s;
      /* UNIVERSAL ICON SIZE — all logos exactly 44px */
      --tile-icon-size: 44px;
      --tile-fill: rgba(142, 142, 147, 0.42);
      --tile-fill-hover: rgba(255, 255, 255, 0.18);
      --tile-border: rgba(255, 255, 255, 0.22);
      --tile-border-hover: rgba(255, 255, 255, 0.45);
      --tile-blur: 18px;
      --tile-saturate: 140%;
      --tile-radius: 22px;
      --tile-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 8px 24px -12px rgba(2, 20, 60, 0.45);
      --tile-shadow-hover: inset 0 1px 0 rgba(255, 255, 255, 0.40), 0 14px 28px -10px rgba(2, 20, 60, 0.55);
      --tile-icon-shadow: drop-shadow(0 4px 10px rgba(0, 20, 60, 0.28));
      --tile-gap: 10px;
      --tile-aspect-square: 1/1;
      --tile-aspect-wide: 306/148;
      --cta-bg: #FFFFFF;
      --cta-color: #0B1B3A;
      --cta-height: 56px;
      --cta-radius: 999px;
      --cta-shadow: 0 14px 34px -12px rgba(0, 10, 40, 0.55), inset 0 1px 0 #FFFFFF;
      --cta-shadow-hover: 0 18px 40px -10px rgba(0, 10, 40, 0.65), inset 0 1px 0 #FFFFFF;
      --dock-bg: rgba(255, 255, 255, 0.16);
      --dock-border: rgba(255, 255, 255, 0.28);
      --dock-blur: 24px;
      --dock-radius: 999px;
      --dock-shadow: 0 10px 30px -10px rgba(0, 10, 35, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      --dock-height: 52px;
      --dock-padding: 5px;
      --dock-item-size: 38px;
      --dock-gap: 6px;
      --dock-inactive-opacity: 0.55;
      --dock-inactive-saturate: 0.70;
      --tooltip-bg: rgba(18, 30, 52, 0.85);
      --tooltip-border: rgba(255, 255, 255, 0.20);
      --tooltip-blur: 16px;
      --toast-bg: rgba(10, 22, 45, 0.90);
      --toast-color: #FFFFFF;
      --z-wallpaper: 0;
      --z-card-base: 10;
      --z-card-content: 20;
      --z-dock: 30;
      --z-tooltip: 40;
      --z-toast: 50;
      --z-debug: 1000;
      /* Brand icon colors */
      --icon-white: #FFFFFF;
      --icon-black: #000000;
      --icon-ig-0: #FEDA75;
      --icon-ig-1: #FA7E1E;
      --icon-ig-2: #D62976;
      --icon-ig-3: #962FBF;
      --icon-ig-4: #4F5BD5;
      --icon-fb: #1877F2;
      --icon-wa: #25D366;
      --icon-yt-bg: #FFFFFF;
      --icon-yt-red: #FF0000;
      --icon-tg-0: #2AABEE;
      --icon-tg-1: #229ED9;
      --icon-mail-env-0: #FFD43B;
      --icon-mail-env-1: #FFA000;
      --icon-mail-flap-0: #FFE066;
      --icon-mail-flap-1: #FFB300;
      --icon-mail-badge: #FF5E3A;
      --icon-mail-crease: #E68A00;
      --icon-mail-sheet: #FFFFFF;
      --icon-mail-line: #E5E5EA;
      --icon-tw: #1D9BF0;
      --icon-li: #0A66C2;
      --icon-gh: #24292E;
      --icon-dr: #EA4C89;
      --icon-be: #053EFF;
      --icon-sp: #1ED760;
      --icon-web-0: #34C759;
      --icon-web-1: #30D158;
      --icon-custom: #5856D6;
    }

    /* ── RESET ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-family-system);
      color: var(--text-primary);
      background-color: var(--wp-stop-4);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      touch-action: manipulation;
    }

    /* ── VIEWPORT ── */
    .app-viewport {
      position: relative;
      width: 100vw;
      height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ── WALLPAPER ── */
    .wallpaper {
      position: absolute;
      inset: -5vw;
      width: 110vw;
      height: 110svh;
      z-index: var(--z-wallpaper);
      overflow: hidden;
      pointer-events: none;
      background: linear-gradient(160deg, var(--wp-stop-0) 0%, var(--wp-stop-1) 18%, var(--wp-stop-2) 34%, var(--wp-stop-3) 62%, var(--wp-stop-4) 100%);
      transition: filter 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, filter;
      transform: translate3d(var(--parallax-x, 0px), var(--parallax-y, 0px), 0);
    }

    .wallpaper__blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      will-change: transform;
    }

    .wallpaper__blob--1 {
      width: min(85vw, 850px);
      height: min(85vw, 850px);
      top: -15%;
      left: -15%;
      background: var(--wp-blob-1);
      animation: blobFloat1 22s ease-in-out infinite alternate;
    }

    .wallpaper__blob--2 {
      width: min(75vw, 750px);
      height: min(75vw, 750px);
      top: 15%;
      right: -20%;
      background: var(--wp-blob-2);
      animation: blobFloat2 26s ease-in-out infinite alternate;
    }

    .wallpaper__blob--3 {
      width: min(90vw, 900px);
      height: min(90vw, 900px);
      bottom: -20%;
      left: 10%;
      background: var(--wp-blob-3);
      animation: blobFloat3 20s ease-in-out infinite alternate;
    }

    @keyframes blobFloat1 {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(3%, 2%) scale(1.04);
      }

      100% {
        transform: translate(-2%, 3%) scale(0.98);
      }
    }

    @keyframes blobFloat2 {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(-3%, -2%) scale(1.03);
      }

      100% {
        transform: translate(2%, 2%) scale(0.97);
      }
    }

    @keyframes blobFloat3 {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(2%, -3%) scale(1.05);
      }

      100% {
        transform: translate(-2%, 2%) scale(0.96);
      }
    }

    .wallpaper__streak {
      position: absolute;
      top: -30%;
      left: -20%;
      width: 140%;
      height: 45%;
      transform: rotate(-24deg);
      background: linear-gradient(90deg, transparent 0%, var(--wp-streak) 50%, transparent 100%);
      filter: blur(30px);
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .wallpaper__grain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.045;
      mix-blend-mode: overlay;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px 180px;
    }

    /* ── STAGE ── */
    .stage {
      position: relative;
      z-index: var(--z-card-base);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: 100%;
      max-height: 100svh;
      perspective: 1200px;
      transform-style: preserve-3d;
    }

    /* ── GLASS CARD ── */
    .glass-card {
      position: relative;
      width: var(--card-width);
      aspect-ratio: 430/640;
      border-radius: var(--card-radius);
      padding: var(--card-padding);
      background: var(--glass-card-bg);
      backdrop-filter: blur(var(--glass-card-blur)) saturate(var(--glass-card-saturate));
      -webkit-backdrop-filter: blur(var(--glass-card-blur)) saturate(var(--glass-card-saturate));
      border: 1px solid var(--glass-card-border);
      box-shadow: var(--glass-card-highlight-top), var(--glass-card-highlight-bottom), var(--glass-card-shadow-outer);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transform-origin: center center;
      will-change: transform, opacity, filter;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 60%;
      height: 50%;
      background: radial-gradient(circle at top left, var(--glass-card-specular-corner) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .card__specular-shine {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle 340px at var(--mx, 50%) var(--my, 30%), rgba(255, 255, 255, 0.18) 0%, transparent 80%);
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 2;
    }

    .card__inner-stroke {
      position: absolute;
      inset: 0;
      border-radius: var(--card-radius);
      padding: 1px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.05) 100%);
      -webkit-mask: linear-gradient(currentColor 0 0) content-box, linear-gradient(currentColor 0 0);
      mask: linear-gradient(currentColor 0 0) content-box, linear-gradient(currentColor 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 3;
    }

    .card__share-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: var(--text-primary);
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 10;
      padding: 7px;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.22s ease;
    }

    .card__share-btn:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.28);
    }

    .card__share-btn:active {
      transform: scale(0.94);
    }

    .card__share-btn:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 3px;
    }

    /* ── HEADER / AVATAR ── */
    .card__header {
      position: relative;
      z-index: var(--z-card-content);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 2px;
    }

    .avatar-container {
      position: relative;
      width: var(--avatar-size);
      height: var(--avatar-size);
      display: grid;
      place-items: center;
      margin-bottom: 10px;
    }

    .avatar-glow {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--member-accent, var(--color-accent)), rgba(255, 255, 255, 0.6), var(--member-accent, var(--color-accent)));
      filter: blur(var(--avatar-glow-blur));
      opacity: var(--avatar-glow-opacity);
      pointer-events: none;
      animation: glowBreathe var(--avatar-glow-duration) ease-in-out infinite alternate;
    }

    @keyframes glowBreathe {
      0% {
        opacity: 0.20;
        transform: scale(0.96);
      }

      100% {
        opacity: 0.45;
        transform: scale(1.05);
      }
    }

    .avatar-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--avatar-border-color);
      box-shadow: var(--avatar-shadow);
      overflow: hidden;
      background-color: rgba(255, 255, 255, 0.15);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      filter: saturate(1.02) contrast(1.02);
      display: block;
    }

    .avatar-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      background: linear-gradient(135deg, var(--member-accent, var(--color-accent)), var(--wp-stop-4));
    }

    .identity-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .name-mask {
      overflow: hidden;
      padding: 2px 8px;
    }

    .member-name {
      font-size: var(--font-size-name);
      font-weight: var(--font-weight-name);
      letter-spacing: var(--letter-spacing-name);
      color: var(--text-primary);
      text-shadow: var(--text-shadow-name);
      text-wrap: balance;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .member-role {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.01em;
      margin-top: 1px;
    }

    .member-tagline {
      font-size: 14px;
      line-height: 1.4;
      color: var(--text-secondary);
      max-width: 30ch;
      text-align: center;
      text-wrap: pretty;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }


    /* ── LINK GRID & TILES ── */
    .card__links-section {
      position: relative;
      z-index: var(--z-card-content);
      margin: 6px 0 10px;
    }

    .link-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: var(--tile-gap);
      list-style: none;
    }

    .tile-wrap {
      grid-column: span var(--tile-col-span, 2);
      display: flex;
    }

    .tile {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tile-fill);
      backdrop-filter: blur(var(--tile-blur)) saturate(var(--tile-saturate));
      -webkit-backdrop-filter: blur(var(--tile-blur)) saturate(var(--tile-saturate));
      border-radius: var(--tile-radius);
      border: 1px solid var(--tile-border);
      box-shadow: var(--tile-shadow);
      text-decoration: none;
      cursor: pointer;
      transform: translate3d(0, 0, 0);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .tile--square {
      aspect-ratio: var(--tile-aspect-square);
    }

    .tile--wide {
      aspect-ratio: var(--tile-aspect-wide);
    }

    /* UNIVERSAL ICON BOX — fixed 44×44 so every logo is identical size */
    .tile__icon-box {
      width: var(--tile-icon-size);
      height: var(--tile-icon-size);
      min-width: var(--tile-icon-size);
      min-height: var(--tile-icon-size);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: var(--tile-icon-shadow);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tile__icon-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (hover:hover) and (pointer:fine) {
      .tile:hover {
        transform: translateY(-3px) scale(1.035);
        background: var(--tile-fill-hover);
        border-color: var(--tile-border-hover);
        box-shadow: var(--tile-shadow-hover), 0 0 20px var(--color-accent-glow);
      }

      .tile:hover .tile__icon-box {
        transform: scale(1.06);
      }

      .tile:hover .tile__tooltip {
        opacity: 1;
        transform: translateX(-50%) translateY(-6px);
        transition-delay: 0.18s;
      }
    }

    .tile:active {
      transform: scale(0.955);
      filter: brightness(0.94);
      transition-duration: 0.09s;
    }

    .tile:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 3px;
    }

    /* Tooltip */
    .tile__tooltip {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%) translateY(0);
      background: var(--tooltip-bg);
      backdrop-filter: blur(var(--tooltip-blur));
      -webkit-backdrop-filter: blur(var(--tooltip-blur));
      border: 1px solid var(--tooltip-border);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-primary);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease, transform 0.12s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 12px rgba(0, 10, 30, 0.35);
      z-index: var(--z-tooltip);
    }

    .tile__tooltip-handle {
      display: block;
      font-size: 9.5px;
      font-weight: 400;
      text-transform: none;
      color: var(--text-muted);
    }

    /* ── CTA PILL ── */
    .card__footer-cta {
      position: relative;
      z-index: var(--z-card-content);
      width: 100%;
    }

    .cta-wrap {
      width: 100%;
    }

    .cta-pill {
      display: grid;
      grid-template-columns: 30px 1fr 30px;
      align-items: center;
      width: 100%;
      height: var(--cta-height);
      border-radius: var(--cta-radius);
      background: var(--cta-bg);
      color: var(--cta-color);
      text-decoration: none;
      font-weight: 650;
      font-size: 16px;
      letter-spacing: -0.01em;
      padding: 0 20px;
      box-shadow: var(--cta-shadow);
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.1s ease;
      will-change: transform;
    }

    .cta-pill__icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cta-pill__label {
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cta-pill__spacer {
      width: 30px;
    }

    @media (hover:hover) and (pointer:fine) {
      .cta-pill:hover {
        transform: translateY(-2px);
        box-shadow: var(--cta-shadow-hover);
      }

      .cta-pill:hover .cta-pill__icon {
        transform: rotate(-6deg);
      }
    }

    .cta-pill:active {
      transform: scale(0.975);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.20), var(--cta-shadow);
    }

    .cta-pill:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 3px;
    }

    /* ── DOCK ── */
    .dock-switcher {
      position: relative;
      z-index: var(--z-dock);
      height: var(--dock-height);
      padding: var(--dock-padding);
      background: var(--dock-bg);
      backdrop-filter: blur(var(--dock-blur));
      -webkit-backdrop-filter: blur(var(--dock-blur));
      border: 1px solid var(--dock-border);
      border-radius: var(--dock-radius);
      box-shadow: var(--dock-shadow);
      display: flex;
      align-items: center;
      gap: var(--dock-gap);
      will-change: transform, opacity;
    }

    .dock-btn {
      position: relative;
      width: var(--dock-item-size);
      height: var(--dock-item-size);
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      opacity: var(--dock-inactive-opacity);
      filter: saturate(var(--dock-inactive-saturate));
      transform: scale(0.94);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.24s ease, filter 0.24s ease;
    }

    .dock-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .dock-btn.is-active {
      opacity: 1;
      filter: saturate(1);
      transform: scale(1.06);
      box-shadow: 0 0 0 2px var(--text-primary), 0 0 16px var(--color-accent-glow);
    }

    @media (hover:hover) and (pointer:fine) {
      .dock-btn:hover:not(.is-active) {
        opacity: 0.85;
        transform: translateY(-2px) scale(0.98);
      }

      .dock-btn:hover .dock-tooltip {
        opacity: 1;
        transform: translateX(-50%) translateY(-6px);
      }
    }

    .dock-btn:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 3px;
    }

    .dock-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(0);
      background: var(--tooltip-bg);
      backdrop-filter: blur(var(--tooltip-blur));
      -webkit-backdrop-filter: blur(var(--tooltip-blur));
      border: 1px solid var(--tooltip-border);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      color: var(--text-primary);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease, transform 0.12s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: var(--z-tooltip);
      box-shadow: 0 4px 12px rgba(0, 10, 30, 0.35);
    }

    /* ── FOOTER / TOAST / MISC ── */
    .site-footer {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: -0.01em;
      pointer-events: none;
    }

    @media (max-height:640px) {
      .site-footer {
        display: none;
      }
    }

    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--toast-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: var(--toast-color);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 550;
      box-shadow: 0 12px 30px rgba(0, 10, 30, 0.45);
      opacity: 0;
      pointer-events: none;
      z-index: var(--z-toast);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .debug-panel {
      position: fixed;
      top: 12px;
      right: 12px;
      max-width: 320px;
      background: rgba(10, 20, 35, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      color: var(--text-secondary);
      z-index: var(--z-debug);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* ── RESPONSIVE ── */
    @media (max-width:480px) {
      .app-viewport {
        padding: 12px 10px;
        align-items: flex-start;
        overflow-y: auto;
      }

      .stage {
        width: 100%;
        margin: auto 0;
        padding: 8px 0;
      }

      .glass-card {
        width: 100%;
        aspect-ratio: auto;
        min-height: 560px;
        border-radius: 24px;
        padding: 24px 18px 20px;
      }

      .link-grid {
        gap: 8px;
      }
    }

    @media (max-height:500px) and (orientation:landscape) {
      .app-viewport {
        overflow-y: auto;
      }

      .stage {
        flex-direction: row;
        align-items: center;
        gap: 16px;
        padding: 12px;
      }

      .glass-card {
        width: 320px;
        aspect-ratio: auto;
        border-radius: 28px;
        padding: 16px;
      }

      .avatar-container {
        width: 72px;
        height: 72px;
        margin-bottom: 4px;
      }

      .dock-switcher {
        flex-direction: column;
        height: auto;
        width: 52px;
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      .wallpaper__blob {
        animation: none !important;
      }

      .avatar-glow {
        animation: none !important;
      }

      .tile:hover,
      .cta-pill:hover,
      .dock-btn:hover {
        transform: none !important;
      }
    }

    @media (prefers-reduced-transparency:reduce) {
      .glass-card {
        background: var(--glass-fallback-solid) !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      .tile {
        background: rgba(30, 48, 76, 0.95) !important;
        backdrop-filter: none !important;
      }

      .dock-switcher {
        background: rgba(20, 36, 60, 0.95) !important;
        backdrop-filter: none !important;
      }
    }

    @media (prefers-contrast:more) {
      .glass-card {
        border: 2px solid var(--text-primary);
        box-shadow: none;
      }

      .tile {
        border: 2px solid var(--text-primary);
      }

      .member-name {
        text-shadow: none;
      }
    }

    @media print {
      body {
        background: none !important;
        color: black !important;
      }

      .wallpaper,
      .dock-switcher,
      .card__share-btn,
      .avatar-glow,
      .site-footer {
        display: none !important;
      }

      .glass-card {
        border: 1px solid black !important;
        background: none !important;
        box-shadow: none !important;
        color: black !important;
      }

      .member-name,
      .member-tagline,
      .tile {
        color: black !important;
      }
    }
  </style>
</head>

          b.style.animationPlayState = hidden ? 'paused' : 'running';
        });
      });

      // Hash routing
      window.addEventListener('hashchange', function () {
        var id = resolveIdFromUrl();
        if (id && id !== activeMemberId) switchMember(id);
      });
    })();
  </script>
</body>
