<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E8FE2"/>
      <stop offset="100%" stop-color="#014BC8"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#auraGrad)"/>
  <!-- Top Specular Highlight Stroke -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="none" stroke="url(#shineGrad)" stroke-width="1.5"/>
  <!-- Brand Lettermark "A" -->
  <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">A</text>
</svg>
